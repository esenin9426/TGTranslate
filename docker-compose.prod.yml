# Production: the image is built by CI and pulled from GHCR, Ollama runs as a container next to the app.
# On the server: docker compose -f docker-compose.prod.yml up -d   (CI does this on every push to main)
x-app: &app
  image: ${IMAGE:-ghcr.io/esenin9426/tgtranslate}:${TAG:-latest}
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://tgt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/tgt
    REDIS_URL: redis://redis:6379/0
    API_URL: http://api:8000
    UPLOAD_DIR: /data/uploads
    OLLAMA_URL: http://ollama:11434
  volumes:
    - uploads:/data/uploads
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_USER: tgt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tgt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgt -h localhost"]
      interval: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  # One-shot: downloads the models into the ollama volume (a no-op when they are already there)
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:7b} && ollama pull ${EMBED_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *app
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30

  worker:
    <<: *app
    command: python -m app.worker
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
      ollama-pull: {condition: service_completed_successfully}

  bot:
    <<: *app
    command: python -m app.bot.main
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
  uploads:
  ollama:
