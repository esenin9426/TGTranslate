[project]
name = "tgtranslate"
version = "0.1.0"
description = "Telegram bot: learn English words from articles and books via quizzes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "alembic>=1.13",
    "aiogram>=3.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "spacy>=3.8",
    "trafilatura>=1.12",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# Offline translation fallback (TRANSLATOR=argos)
argos = ["argostranslate>=1.9"]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI declares dependencies as argument defaults
