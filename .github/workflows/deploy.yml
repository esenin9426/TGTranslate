name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]' && python -m spacy download en_core_web_sm
      - run: ruff check .
      - run: pytest

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      # GHCR requires a lowercase repository name
      - id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: deploy  # never run two deploys at the same time
    environment: production
    permissions:
      contents: read
      packages: read  # lets the server pull the private image with this job's token
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ github.sha }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'tgtranslate' }}  # relative to the SSH user's home
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<CFG
          Host server
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            Port ${{ secrets.SSH_PORT || 22 }}
            IdentityFile ~/.ssh/id_deploy
          CFG
      - name: Upload compose file and image tag
        run: |
          ssh server "mkdir -p $DEPLOY_DIR"
          scp docker-compose.prod.yml "server:$DEPLOY_DIR/docker-compose.yml"
          # docker compose reads .env from the project dir automatically; the tag goes into a separate file
          # so the server's .env with the secrets is never touched by CI
          printf 'IMAGE=%s\nTAG=%s\n' "$IMAGE" "$TAG" | ssh server "cat > $DEPLOY_DIR/.deploy.env"
      - name: Pull and restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | ssh server "docker login $REGISTRY -u '${{ github.actor }}' --password-stdin"
          ssh server "cd $DEPLOY_DIR \
            && docker compose --env-file .env --env-file .deploy.env pull \
            && docker compose --env-file .env --env-file .deploy.env up -d --remove-orphans; \
            status=\$?; docker logout $REGISTRY; docker image prune -af --filter until=72h; exit \$status"
